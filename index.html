
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Javiera & Jorge</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#fff;
  overflow:hidden;
}

#video,#poster{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#fff;
}

#poster{
  z-index:5;
  pointer-events:none;
}

#sound{
  position:fixed;
  bottom:35px;
  left:50%;
  transform:translateX(-50%);
  z-index:15;
  border:1px solid rgba(255,255,255,.8);
  border-radius:30px;
  padding:12px 22px;
  background:rgba(255,255,255,.85);
  color:#333;
  font-family:Georgia,serif;
  font-size:13px;
  cursor:pointer;
  backdrop-filter:blur(8px);
}

#fade{
  position:fixed;
  inset:0;
  z-index:20;
  background:#fff;
  opacity:0;
  pointer-events:none;
  transition:opacity .8s ease;
}

#fade.on{opacity:1}

#fallback{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  font-family:Georgia,serif;
  font-size:17px;
  cursor:pointer;
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline preload="auto">
  <source src="sobre.mp4" type="video/mp4">
</video>

<img id="poster" src="portada.png" alt="Javiera y Jorge">

<button id="sound" type="button">
  ♫ Activar sonido
</button>

<button id="fallback" type="button">
  Pulsa para reproducir
</button>

<div id="fade"></div>

<script>
const DESTINO = "https://javierayjorge.my.canva.site/invitacion-boda";

const v = document.getElementById("video");
const poster = document.getElementById("poster");
const sound = document.getElementById("sound");
const fallback = document.getElementById("fallback");
const fade = document.getElementById("fade");

async function iniciar(){
  try{
    await v.play();
    poster.style.display="none";
    fallback.style.display="none";
  }catch(e){
    fallback.style.display="flex";
  }
}

window.addEventListener("load",iniciar);

fallback.addEventListener("click",async()=>{
  try{
    v.muted=false;
    await v.play();
    poster.style.display="none";
    fallback.style.display="none";
    sound.style.display="none";
  }catch(e){
    // Se mantiene el botón si falla la reproducción.
  }
});

sound.addEventListener("click",()=>{
  v.muted=false;
  v.volume=1;
  sound.style.display="none";
});

v.addEventListener("ended",()=>{
  sound.style.display="none";
  fade.classList.add("on");

  setTimeout(()=>{
    window.location.replace(DESTINO);
  },820);
});
</script>

</body>
</html>
